<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><title>كافتيريا المدرسة</title><style> *{box-sizing:border-box}body{margin:0;background:#faf6ef;color:#35291f;font:20px system-ui,sans-serif}header{background:#65452e;color:white;padding:20px;text-align:center}h1{margin:0;font-size:30px}main{max-width:1100px;margin:auto;padding:16px}button,input,select{font:inherit;border-radius:12px;padding:12px;border:1px solid #bca994}button{background:white;cursor:pointer;min-height:48px}button.primary{background:#246347;color:white;border:0}button:disabled{opacity:.4}nav,.line{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px}.tile,section{background:white;border:1px solid #e1d5c5;border-radius:16px;padding:14px;margin-bottom:12px}.tile{text-align:center}.pic{width:100%;height:125px;object-fit:contain;background:#f6efe5;border-radius:10px;display:grid;place-items:center;font-size:65px}.tile>button:first-child{width:100%;border:0;padding:0}input,select{max-width:100%;background:white}label{display:block;margin:10px 0 4px}small{color:#65584d}.total{font-size:30px;font-weight:bold}.active{background:#65452e;color:white}.danger{color:#a02020} [hidden]{display:none!important} </style><header><h1>كافتيريا المدرسة</h1><div>أهلاً وسهلاً بكم</div></header><main><nav><button id="simple">اختيار المنتجات</button><button id="cashier">صندوق الدفع</button><button id="admin">إدارة الطاقم 🔒</button></nav><div id="notice" role="status"></div><div id="student"><nav id="cats"></nav><div id="menu" class="grid"></div><section><h2>سلة الطلبات</h2><div id="basket"></div><div id="payment"><div class="total" id="total"></div><label for="paid">المبلغ المدفوع (₪)</label><input id="paid" type="number" min="0" step="0.01" inputmode="decimal"><div class="line" id="bills"></div><div id="change" aria-live="polite"></div></div><div class="line"><button class="primary" id="confirm">تأكيد الطلب</button><button id="reset">طلب جديد</button></div></section></div><div id="staff" hidden><section><h2>إدارة المنتجات</h2><form id="edit"><input type="hidden" id="pid"><label>اسم المنتج</label><input id="pname" required maxlength="80"><label>الفئة</label><select id="pcat"></select><label>السعر (₪)</label><input id="price" type="number" min="0" step="0.01" required><label>صورة المنتج</label><input id="photo" type="file" accept="image/*"><div id="preview"></div><button type="button" id="removephoto">إزالة الصورة</button><div class="line"><button class="primary">حفظ المنتج</button><button type="button" id="cancel">إلغاء / منتج جديد</button></div></form><div id="inventory"></div></section><section><h2>سجل الطلبات</h2><div id="history"></div><button id="export">تصدير نسخة احتياطية</button><label>استعادة نسخة احتياطية</label><input id="import" type="file" accept="application/json"><button id="pinchange">تغيير رمز الطاقم</button></section></div></main><script>
const $=id=>document.getElementById(id), cats=['المأكولات','المشروبات الساخنة','المشروبات الباردة','الحلويات'], icons=['🥪','☕','🧃','🍰'];let db;try{db=JSON.parse(localStorage.getItem('schoolCafeV1'))}catch{};db=db||{products:[['توست جبنة',10,0],['ساندويش لبنة',8,0],['قهوة',5,1],['شاي',4,1],['عصير برتقال',6,2],['ماء',3,2],['كعكة شوكولاتة',7,3],['كرواسون',6,3]].map((p,i)=>({id:String(i),name:p[0],price:p[1],cat:p[2],photo:''})),orders:[],pin:'1234'};let mode='simple',category=-1,cart={},photo='',photoBusy=false;const money=n=>Number(n).toFixed(2)+' ₪';function save(next){try{localStorage.setItem('schoolCafeV1',JSON.stringify(next));db=next;return true}catch(e){alert('تعذر الحفظ. قد تكون مساحة التخزين ممتلئة.');return false}}function el(tag,t,cl){let x=document.createElement(tag);if(t!==undefined)x.textContent=t;if(cl)x.className=cl;return x}function btn(t,fn,cl){let b=el('button',t,cl);b.type='button';b.onclick=fn;return b}function pic(p){if(p.photo){let im=el('img');im.className='pic';im.src=p.photo;im.alt=p.name;return im}return el('div',icons[p.cat],'pic')}function msg(t){$('notice').textContent=t}function switchMode(m){mode=m;$('student').hidden=m==='staff';$('staff').hidden=m!=='staff';$('payment').hidden=m!=='cash';$('simple').className=m==='simple'?'active':'';$('cashier').className=m==='cash'?'active':'';$('admin').className=m==='staff'?'active':'';msg('');if(m==='staff')renderStaff();else render()}
$('simple').onclick=()=>switchMode('simple');$('cashier').onclick=()=>switchMode('cash');$('admin').onclick=()=>{if(prompt('رمز الطاقم')===db.pin)switchMode('staff');else msg('الرمز غير صحيح')};function add(id,n){cart[id]=Math.max(0,(cart[id]||0)+n);render();msg('')}function lines(){return db.products.filter(p=>cart[p.id]>0).map(p=>({name:p.name,price:p.price,qty:cart[p.id]}))}function total(){return Math.round(lines().reduce((s,p)=>s+p.price*p.qty,0)*100)/100}function render(){let c=$('cats');c.replaceChildren();['الكل',...cats].forEach((n,i)=>c.append(btn(n,()=>{category=i-1;render()},category===i-1?'active':'')));let m=$('menu');m.replaceChildren();db.products.filter(p=>category===-1||p.cat===category).forEach(p=>{let t=el('div',undefined,'tile'),b=btn('',()=>add(p.id,1));b.append(pic(p),el('strong',p.name));if(mode==='cash')b.append(el('div',money(p.price)));t.append(b);let r=el('div',undefined,'line');r.append(btn('−',()=>add(p.id,-1)),el('strong',String(cart[p.id]||0)),btn('+',()=>add(p.id,1),'primary'));t.append(r);m.append(t)});let b=$('basket');b.replaceChildren();lines().forEach(p=>b.append(el('p',p.name+' × '+p.qty+(mode==='cash'?' — '+money(p.price*p.qty):''))));if(!lines().length)b.append(el('p','السلة فارغة'));$('total').textContent='المجموع: '+money(total());updatePay()}
function updatePay(){let v=$('paid').value, d=Math.round((Number(v)-total())*100)/100;$('change').textContent=v===''?'':d>=0?'الباقي: '+money(d):'المبلغ الناقص: '+money(-d);$('confirm').disabled=!lines().length||(mode==='cash'&&(v===''||d<0||!Number.isFinite(Number(v))))} $('paid').oninput=updatePay;[5,10,20,50,100].forEach(n=>$('bills').append(btn(n+' ₪',()=>{$('paid').value=n;updatePay()})));function reset(){cart={};$('paid').value='';render()}$('reset').onclick=()=>{reset();msg('')};$('confirm').onclick=()=>{let order={date:new Date().toISOString(),items:lines(),total:total(),paid:mode==='cash'?Number($('paid').value):null};if(save({...db,orders:[order,...db.orders]})){reset();msg('✓ تم حفظ الطلب بنجاح')}};
cats.forEach((c,i)=>{let o=el('option',c);o.value=i;$('pcat').append(o)});function preview(){let p=$('preview');p.replaceChildren();if(photo)p.append(pic({photo,name:'صورة',cat:0}))}function clearEdit(){$('edit').reset();$('pid').value='';photo='';preview()}$('cancel').onclick=clearEdit;$('removephoto').onclick=()=>{photo='';$('photo').value='';preview()};$('photo').onchange=()=>{let f=$('photo').files[0];if(!f)return;photoBusy=true;let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas'),s=Math.min(1,600/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);photo=c.toDataURL('image/jpeg',.72);photoBusy=false;preview()};im.onerror=()=>{photoBusy=false;alert('تعذر قراءة الصورة')};im.src=r.result};r.onerror=()=>{photoBusy=false};r.readAsDataURL(f)};$('edit').onsubmit=e=>{e.preventDefault();if(photoBusy)return;let p={id:$('pid').value||Date.now().toString(),name:$('pname').value.trim(),cat:Number($('pcat').value),price:Number($('price').value),photo};if(!p.name)return;let ps=db.products.filter(x=>x.id!==p.id);ps.push(p);if(save({...db,products:ps})){clearEdit();renderStaff()}};function renderStaff(){let a=$('inventory');a.replaceChildren();db.products.forEach(p=>{let r=el('div',undefined,'line');r.append(el('span',p.name+' — '+money(p.price)),btn('تعديل',()=>{$('pid').value=p.id;$('pname').value=p.name;$('pcat').value=p.cat;$('price').value=p.price;photo=p.photo;preview();$('edit').scrollIntoView()}),btn('حذف',()=>{if(confirm('حذف المنتج؟')&&save({...db,products:db.products.filter(x=>x.id!==p.id)})){delete cart[p.id];renderStaff()}},'danger'));a.append(r)});let h=$('history');h.replaceChildren();db.orders.forEach(o=>{let r=el('div',undefined,'tile');r.append(el('strong',new Date(o.date).toLocaleString('ar')),el('p',o.items.map(p=>p.name+' × '+p.qty).join('، ')),el('p',money(o.total)+(o.paid===null?' — طلب فقط':' — المدفوع: '+money(o.paid))));h.append(r)});if(!db.orders.length)h.append(el('p','لا توجد طلبات'))}
$('pinchange').onclick=()=>{let p=prompt('رمز جديد (4 أرقام على الأقل)');if(p&&/^\d{4,}$/.test(p))save({...db,pin:p})};$('export').onclick=()=>{let a=el('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.download='cafeteria-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('import').onchange=async()=>{try{let x=JSON.parse(await $('import').files[0].text());if(!Array.isArray(x.products)||!Array.isArray(x.orders)||typeof x.pin!=='string'||!x.products.every(p=>typeof p.id==='string'&&typeof p.name==='string'&&Number.isFinite(p.price)&&p.price>=0&&Number.isInteger(p.cat)&&p.cat>=0&&p.cat<4&&typeof p.photo==='string'))throw Error();if(confirm('استبدال البيانات الحالية؟')&&save(x)){cart={};clearEdit();renderStaff()}}catch{alert('ملف غير صالح')}};switchMode('simple');if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></html>
